name: ASTRA-MED Codespace Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check GitHub CLI
        run: gh --version

      - name: List ASTRA-MED Codespaces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh codespace list \
            --repo WhovianCoder136/NASA-SPACE-HACKATHON
